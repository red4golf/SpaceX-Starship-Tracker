name: Update Starship Dashboard Data

on:
  schedule:
    # Trigger around 08:00 and 20:00 America/Los_Angeles across DST/PST changes.
    # We run at both possible UTC offsets and gate in-job using local PT hour.
    - cron: '0 3,4,15,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Determine if this run matches 08:00/20:00 PT
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour_pt=$(TZ='America/Los_Angeles' date +'%H')
          if [ "$hour_pt" = "08" ] || [ "$hour_pt" = "20" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate report schema and content
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/validate_reports.py

      - name: Generate dashboard JSON
        if: steps.gate.outputs.should_run == 'true'
        id: generate
        run: python scripts/update_dashboard.py

      - name: Commit data updates
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): refresh dashboard feed"
          git push

      - name: Telegram notify
        if: steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py

      - name: Print mode summary
        if: steps.gate.outputs.should_run == 'true'
        run: echo "Dashboard mode is ${{ steps.generate.outputs.mode }}"


      - name: Write run summary
        if: always()
        run: |
          python - <<'PY_SUM'
          import json, pathlib
          f = pathlib.Path('data/dashboard.json')
          if f.exists():
              d = json.loads(f.read_text())
              print(
                  f"mode: {d.get('mode')}\n"
                  f"events: {len(d.get('timeline', []))}\n"
                  f"sources: {d.get('health', {}).get('source_count')}"
              )
          else:
              print('dashboard.json missing')
          PY_SUM

      - name: Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=⚠️ Workflow failure: ${{ github.workflow }} · run ${{ github.run_id }}"
          fi

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starship Full-Stack Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Starship Full-Stack Tracker</h1>
      <p id="last-updated"></p>
      <div id="health-status"></div>
    </header>

    <main>
      <section class="panel">
        <h2>Fleet Overview</h2>
        <div id="fleet-overview" class="grid"></div>
      </section>

      <section class="panel">
        <h2>Mission Timeline</h2>
        <div class="filters">
          <label>
            Confidence
            <select id="confidence-filter">
              <option value="all">All</option>
              <option value="confirmed">Confirmed</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label>
            Vehicle
            <select id="vehicle-filter">
              <option value="all">All</option>
            </select>
          </label>
        </div>
        <div id="mission-timeline" class="timeline"></div>
      </section>

      <section class="panel">
        <h2>Launch Map Context</h2>
        <div id="map-context"></div>
        <div id="map-canvas" aria-label="Map preview"></div>
        <div id="map-legend"></div>
      </section>
    </main>

    <template id="vehicle-card-template">
      <article class="card">
        <h3 class="name"></h3>
        <p><strong>Status:</strong> <span class="status"></span></p>
        <p><strong>Next Milestone:</strong> <span class="next-milestone"></span></p>
        <p><strong>Confidence:</strong> <span class="confidence badge"></span></p>
        <p><strong>Countdown:</strong> <span class="countdown"></span></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
